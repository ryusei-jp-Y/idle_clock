name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同一ブランチで新しい push があれば進行中の古いランを打ち切る（Actions 分の節約）。
# main は打ち切らない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.yaml の Dart SDK 制約 (^3.12.1) を満たす stable Flutter を使う。
      # 万一 stable が制約を満たさない場合は flutter-version を明示ピンする。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
